spring:
  config:
    activate:
      on-profile: dev

  datasource:
    # Por padrao no perfil dev local, se nao houver Supabase configurado nas variaveis de ambiente, usa H2 em memoria
    url: ${DB_URL:jdbc:h2:mem:operacao_aprovacao_dev;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
    driver-class-name: ${DB_DRIVER:org.h2.Driver}

  jpa:
    database-platform: ${DB_DIALECT:org.hibernate.dialect.H2Dialect}
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  h2:
    console:
      enabled: true
      path: /h2-console

logging:
  level:
    com.operacaoaprovacao: DEBUG
    org.springframework.security: INFO
