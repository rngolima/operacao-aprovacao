<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="operacao_aprovacao_app">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>operacao_aprovacao_app</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script>
    // Sintetizador de Áudio e Voz Humana do Professor CRAVOU AI
    window.professorCravouVoice = {
      speak: function(text, onStartCallback, onEndCallback) {
        try {
          if (!('speechSynthesis' in window)) {
            console.warn('Speech synthesis not supported in this browser');
            return false;
          }
          window.speechSynthesis.cancel();

          // Limpa caracteres especiais, emojis e marcações markdown para fala natural e humana
          var cleanText = text
            .replace(/[\*\_#`>]/g, '')
            .replace(/[🦉🦅👉💡🎯🔍⚖️⚡✨✓✗💬📢🔊⏸️]/g, '')
            .replace(/https?:\/\/\S+/g, '')
            .replace(/\s+/g, ' ')
            .trim();

          var utterance = new SpeechSynthesisUtterance(cleanText);
          utterance.lang = 'pt-BR';
          utterance.rate = 1.02; // Cadência natural de professor
          utterance.pitch = 0.98; // Tom professoral firme e acolhedor

          // Busca voz brasileira natural
          var voices = window.speechSynthesis.getVoices();
          var ptVoice = voices.find(function(v) {
            return v.lang === 'pt-BR' || v.lang === 'pt_BR' || v.lang.indexOf('pt') === 0;
          });
          if (ptVoice) {
            utterance.voice = ptVoice;
          }

          utterance.onstart = function() {
            if (window._cravouVoiceStateListener) window._cravouVoiceStateListener(true);
          };
          utterance.onend = function() {
            if (window._cravouVoiceStateListener) window._cravouVoiceStateListener(false);
          };
          utterance.onerror = function() {
            if (window._cravouVoiceStateListener) window._cravouVoiceStateListener(false);
          };

          window.speechSynthesis.speak(utterance);
          return true;
        } catch(e) {
          console.error('Erro na sintese de voz:', e);
          return false;
        }
      },
      stop: function() {
        try {
          if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel();
            if (window._cravouVoiceStateListener) window._cravouVoiceStateListener(false);
          }
        } catch(e) {}
      },
      isSpeaking: function() {
        return ('speechSynthesis' in window) && window.speechSynthesis.speaking;
      }
    };
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
